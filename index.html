<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clown Face</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }
    .clown {
      position: relative;
      width: 200px;
      height: 200px;
      background: #ffe0bd;
      border-radius: 50%;
      border: 4px solid #000;
    }
    .eye {
      position: absolute;
      width: 30px;
      height: 30px;
      background: white;
      border-radius: 50%;
      top: 60px;
    }
    .eye::after {
      content: "";
      position: absolute;
      width: 15px;
      height: 15px;
      background: black;
      border-radius: 50%;
      top: 7px;
      left: 7px;
    }
    .eye.left { left: 40px; }
    .eye.right { right: 40px; }
    .nose {
      position: absolute;
      width: 40px;
      height: 40px;
      background: red;
      border-radius: 50%;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      border: 2px solid #000;
    }
    .mouth {
      position: absolute;
      width: 100px;
      height: 50px;
      border: 4px solid #000;
      border-top: none;
      border-radius: 0 0 50px 50px;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
    }
    .hat {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 60px;
      background: blue;
      border-radius: 60px 60px 0 0;
      border: 4px solid #000;
    }
    .hat::after {
      content: "";
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 30px;
      background: yellow;
      border-radius: 50%;
      border: 2px solid #000;
    }
  </style>
</head>
<body>
  <div class="clown">
    <div class="hat"></div>
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="nose"></div>
    <div class="mouth"></div>
  </div>
</body>
</html>
